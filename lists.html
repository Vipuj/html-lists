<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <!-- Unordered list: items are shown with bullets -->
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <!-- Ordered list: items are shown with numbers -->
    <ol>
        <li>Wake up</li>
        <li>Go to college</li>
        <li>Study</li>
    </ol>

    <!-- Lists can also be nested inside another list -->
    <ul>
        <li>Frontend
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        </li>
    </ul>

</body>
</html>
